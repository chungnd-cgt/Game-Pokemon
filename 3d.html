<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon Demo 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Nunito', 'Segoe UI', Arial, sans-serif; }
      /* Canvas 3D nằm dưới, canvas Phaser (nền trong suốt) nằm trên */
      #view3d { position: fixed; inset: 0; z-index: 0; }
      #game { position: relative; z-index: 1; width: 100vw; height: 100vh; }
      .chip { position: fixed; z-index: 2; padding: 4px 10px; border-radius: 999px; background: rgba(10, 12, 20, 0.6); color: rgba(255, 255, 255, 0.8); font-size: 12px; font-weight: 800; pointer-events: none; white-space: nowrap; }
      #corner { position: fixed; z-index: 2; left: 50%; top: 6px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; opacity: 0.85; }
      #corner .chip { position: static; }
      #fps { font-family: monospace; }
      #badge { left: 50%; top: 34px; transform: translateX(-50%); background: rgba(160, 90, 20, 0.8); color: #fff; display: none; }
      #toast { left: 50%; top: 64px; transform: translateX(-50%); font-size: 14px; opacity: 0; transition: opacity 0.2s; }
      #toast.show { opacity: 1; }
      #back { pointer-events: auto; color: #f8d878; text-decoration: none; }
      .error { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; text-align: center; line-height: 1.6; color: #fff; font-weight: 800; font-size: 18px; background: #0d1018; }
    </style>
  </head>
  <body>
    <div id="view3d"></div>
    <div id="game"></div>
    <div id="badge" class="chip">Khu vực này chưa có 3D, đang hiển thị bản 2D</div>
    <div id="toast" class="chip"></div>
    <div id="corner">
      <div id="hint" class="chip">V: góc nhìn • cuộn chuột: zoom</div>
      <div id="fps" class="chip"></div>
      <a id="back" class="chip" href="./">← Bản 2D</a>
    </div>
    <script>
      // Có lỗi thì hiện thẳng lên màn hình (trình duyệt không hỗ trợ WebGL 2, mở file trực tiếp...)
      function show3dError(msg) {
        const el = document.createElement('div');
        el.className = 'error';
        el.innerHTML = 'Không chạy được bản 3D<br><small style="font-weight:700;color:#f8a0a0">' + String(msg).replace(/</g, '&lt;') + '</small>';
        document.body.appendChild(el);
      }
      if (location.protocol === 'file:') show3dError('Hãy chạy "npm run dev" rồi mở http://localhost:5173/3d.html, không mở file trực tiếp.');
      else if (!document.createElement('canvas').getContext('webgl2')) show3dError('Trình duyệt chưa bật WebGL 2 / tăng tốc phần cứng (Chrome: Settings → System → Use graphics acceleration).');
      window.addEventListener('error', (e) => show3dError(e.message));
      window.addEventListener('unhandledrejection', (e) => show3dError(e.reason?.message ?? e.reason));
    </script>
    <script type="module" src="/src/three/main3d.js"></script>
  </body>
</html>
