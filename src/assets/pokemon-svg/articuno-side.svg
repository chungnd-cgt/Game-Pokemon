    <path d="M118 180 L112 230 M138 182 L140 230" fill="none" stroke-width="12"/>
    <path d="M118 180 L112 230 M138 182 L140 230" fill="none" stroke="#8a9cb8" stroke-width="5"/>
    <path d="M112 228 L96 238 M112 228 L104 244 M140 228 L124 238 M140 228 L132 244" fill="none" stroke="#2b2433" stroke-width="5"/>
