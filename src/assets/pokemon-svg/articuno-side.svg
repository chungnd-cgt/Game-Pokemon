    <path d="M78 58 C96 40 120 34 146 38 C128 46 116 56 104 68 Z" fill="url(#crest)"/>
    <path d="M84 70 C104 60 128 60 150 70 C130 72 114 76 100 84 Z" fill="url(#crest)"/>
