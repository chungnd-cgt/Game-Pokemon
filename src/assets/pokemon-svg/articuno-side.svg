    <ellipse cx="68" cy="74" rx="28" ry="24" fill="url(#skin)"/>
    <!-- beak -->
    <path d="M44 72 L18 82 L44 90 Z" fill="#9aa2b0"/>
    <!-- near wing -->
    <path d="M104 132 C112 96 136 54 174 22 C176 46 172 60 166 72 C178 78 182 92 176 102 C186 110 184 124 174 130 C162 146 136 152 116 150 Z" fill="url(#wing)"/>
  </g>
  <!-- chest -->
  <path d="M90 150 C92 172 108 186 126 188 C112 176 104 162 102 146 Z" fill="#e2f4ff"/>
  <!-- feather lines -->
  <path d="M166 72 C146 90 130 108 116 128 M176 102 C158 114 140 126 122 138 M174 130 C158 136 140 142 124 146" fill="none" stroke="#2f6cbc" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 182 C200 196 216 214 228 238" fill="none" stroke="#2c5cb0" stroke-width="4" stroke-linecap="round"/>
