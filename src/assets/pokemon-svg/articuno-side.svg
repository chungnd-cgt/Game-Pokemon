  <path d="M164 140 C172 160 162 180 140 188 C132 190 124 190 116 188 C144 176 160 160 164 140 Z" fill="#2c6ab8" opacity="0.4"/>
  <ellipse cx="60" cy="60" rx="12" ry="5" fill="#fff" opacity="0.5" transform="rotate(-20 60 60)"/>
  <ellipse cx="140" cy="62" rx="16" ry="5" fill="#fff" opacity="0.45" transform="rotate(-48 140 62)"/>
  <path d="M20 82 L42 82" stroke="#2b2433" stroke-width="2.5"/>
  <!-- eye -->
  <path d="M48 66 L68 72 C68 82 62 86 56 86 C50 86 48 78 48 66 Z" fill="#c8202a" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="56" cy="74" r="2.6" fill="#fff"/>
</svg>
