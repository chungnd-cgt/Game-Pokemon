    <path d="M60 104 C78 76 112 46 168 14 C164 40 170 62 196 96 C176 112 152 124 128 126 C104 124 78 116 60 104 Z" fill="url(#shell)"/>
  </g>
  <!-- segmented spine -->
  <path d="M128 128 L128 194 M116 140 L140 140 M114 154 L142 154 M116 168 L140 168 M120 182 L136 182" stroke="#2b2433" stroke-width="3.5" stroke-linecap="round"/>
