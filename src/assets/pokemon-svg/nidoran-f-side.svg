  <path d="M30 152 Q50 158 70 152" fill="none" stroke="#2b2433" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 152 L36 164 L44 164 L44 154 Z" fill="#fff" stroke="#2b2433" stroke-width="2.5" stroke-linejoin="round"/>
