    <ellipse cx="112" cy="62" rx="16" ry="34" fill="url(#ear)" transform="rotate(30 112 62)"/>
    <!-- sừng nhỏ -->
    <path d="M60 88 L64 58 L82 82 Z" fill="#e8ecfc"/>
    <!-- đầu quay trái, mõm nhô -->
    <path d="M28 130 C26 100 52 78 90 78 C128 78 150 100 148 130 C146 162 120 178 88 178 C60 178 40 170 32 156 C24 150 24 138 28 130 Z" fill="url(#skin)"/>
  </g>
  <g fill="#5c62b4">
    <ellipse cx="102" cy="94" rx="9" ry="6" transform="rotate(-10 102 94)"/>
    <ellipse cx="170" cy="168" rx="11" ry="8"/>
    <ellipse cx="200" cy="190" rx="9" ry="7"/>
    <ellipse cx="150" cy="208" rx="7" ry="6"/>
    <ellipse cx="128" cy="160" rx="7" ry="5"/>
  </g>
  <path d="M142 104 C154 134 140 166 104 176 C128 158 142 134 142 104 Z" fill="#7c88c8" opacity="0.5"/>
  <path d="M210 164 C218 198 200 226 160 230 C190 214 206 194 210 164 Z" fill="#7c88c8" opacity="0.5"/>
  <ellipse cx="72" cy="94" rx="16" ry="7" fill="#fff" opacity="0.5" transform="rotate(-20 72 94)"/>
  <path d="M100 246 l5 -9 l5 9 Z M114 246 l5 -9 l5 9 Z M186 246 l5 -9 l5 9 Z M200 246 l5 -9 l5 9 Z" fill="#fff" stroke="#2b2433" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- mắt đỏ -->
  <ellipse cx="68" cy="118" rx="11" ry="14" fill="#fff" stroke="#2b2433" stroke-width="4"/>
  <ellipse cx="65" cy="120" rx="7" ry="9" fill="#d4303e"/>
  <ellipse cx="64" cy="122" rx="4" ry="5" fill="#2b2433"/>
  <circle cx="67" cy="114" r="3.5" fill="#fff"/>
