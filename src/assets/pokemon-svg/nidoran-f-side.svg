    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36a6a8"/>
      <stop offset="1" stop-color="#22707e"/>
    </linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tai phía xa -->
    <ellipse cx="140" cy="66" rx="22" ry="40" fill="#94a2dc" transform="rotate(40 140 66)"/>
    <!-- đuôi ngắn -->
    <path d="M206 176 C224 170 238 180 242 196 C226 202 212 200 200 192 Z" fill="#a4b0e6"/>
    <!-- chân phía xa -->
    <path d="M90 196 L88 244 L112 244 L114 200 Z" fill="#94a2dc"/>
    <path d="M176 196 L180 244 L204 244 L200 190 Z" fill="#94a2dc"/>
    <!-- gai lưng nhỏ -->
    <path d="M132 146 L144 114 L162 142 Z" fill="#c4ccf2"/>
    <path d="M162 146 L180 116 L188 150 Z" fill="#e8ecfc"/>
    <path d="M188 154 L210 130 L212 166 Z" fill="#e8ecfc"/>
