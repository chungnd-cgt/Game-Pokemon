    <path d="M114 122 C92 96 58 76 2 70 C18 60 28 48 28 30 C42 42 56 46 68 42 C62 26 68 12 82 0 C86 18 96 30 108 34 C106 54 108 78 120 100 Z" fill="url(#fire)"/>
    <path d="M142 122 C164 96 198 76 254 70 C238 60 228 48 228 30 C214 42 200 46 188 42 C194 26 188 12 174 0 C170 18 160 30 148 34 C150 54 148 78 136 100 Z" fill="url(#fire)"/>
    <!-- wings -->
    <path d="M114 126 C94 106 64 88 26 80 C30 98 42 110 54 118 C50 128 54 140 64 144 C64 156 74 164 86 164 C94 156 102 150 116 148 Z" fill="url(#skin)"/>
    <path d="M142 126 C162 106 192 88 230 80 C226 98 214 110 202 118 C206 128 202 140 192 144 C192 156 182 164 170 164 C162 156 154 150 140 148 Z" fill="#f4a632"/>
