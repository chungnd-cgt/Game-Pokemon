<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd86a"/><stop offset="1" stop-color="#f09a28"/></linearGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="75%"><stop offset="0" stop-color="#fff7b0"/><stop offset="0.4" stop-color="#ffc63a"/><stop offset="1" stop-color="#f04a1c"/></radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd040"/><stop offset="0.55" stop-color="#ff8a2a"/><stop offset="1" stop-color="#e83a1c"/></linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
