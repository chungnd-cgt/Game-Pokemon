    <path d="M108 180 C92 204 66 218 34 216 C50 230 76 238 98 232 C94 242 98 250 106 255 C114 244 122 234 128 224 C134 234 142 244 150 255 C158 250 162 242 158 232 C180 238 206 230 222 216 C190 218 164 204 148 180 Z" fill="url(#flame)"/>
  </g>
  <!-- feather lines -->
  <path d="M54 118 C74 124 92 132 108 142 M64 144 C80 144 96 144 110 146 M202 118 C182 124 164 132 148 142 M192 144 C176 144 160 144 146 146" fill="none" stroke="#c87414" stroke-width="4" stroke-linecap="round"/>
  <!-- shading -->
  <path d="M150 128 C164 148 164 176 152 190 C146 194 140 196 132 196 C152 178 156 150 150 128 Z" fill="#c87414" opacity="0.45"/>
  <ellipse cx="110" cy="140" rx="8" ry="14" fill="#fff" opacity="0.3" transform="rotate(15 110 140)"/>
