<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0c8d8"/>
      <stop offset="1" stop-color="#9ca4b8"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6ecd0"/>
      <stop offset="1" stop-color="#d8c494"/>
    </linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- thick segmented tail curling out to the right -->
    <path d="M168 196 C200 204 226 196 236 172 C240 160 252 160 252 174 C250 206 220 232 170 230 Z" fill="#8a92a8"/>
    <!-- legs -->
    <path d="M70 186 C56 206 56 230 68 242 L114 242 C120 226 116 204 106 190 Z" fill="#9ca4b8"/>
    <path d="M186 186 C200 206 200 230 188 242 L142 242 C136 226 140 204 150 190 Z" fill="#8a92a8"/>
    <!-- body -->
    <path d="M128 82 C176 82 202 118 200 160 C198 198 170 222 128 222 C86 222 58 198 56 160 C54 118 80 82 128 82 Z" fill="url(#rock)"/>
    <!-- back spikes peeking out at the shoulders -->
    <path d="M70 100 L52 84 L72 82 Z M186 100 L204 84 L184 82 Z" fill="#b4bccc"/>
    <!-- arms out with claws -->
    <path d="M68 118 C50 118 34 108 26 92 C22 82 32 76 40 82 C50 92 62 98 78 100 Z" fill="#b4bccc"/>
    <path d="M188 118 C206 118 222 108 230 92 C234 82 224 76 216 82 C206 92 194 98 178 100 Z" fill="#8a92a8"/>
    <!-- head -->
    <path d="M128 16 C160 16 178 38 178 64 C178 92 158 108 128 108 C98 108 78 92 78 64 C78 38 96 16 128 16 Z" fill="url(#rock)"/>
    <!-- ears / head spikes -->
    <path d="M86 40 L70 8 L104 26 Z" fill="#b4bccc"/>
    <path d="M170 40 L186 8 L152 26 Z" fill="#9ca4b8"/>
    <!-- drill horn on the snout -->
    <path d="M108 74 L128 4 L148 74 Z" fill="url(#horn)"/>
  </g>
  <!-- tan belly plate with ridges -->
  <path d="M96 128 C110 120 146 120 160 128 C168 160 162 196 128 212 C94 196 88 160 96 128 Z" fill="#e8d4a8" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <path d="M96 148 C116 154 140 154 160 148 M96 170 C116 176 140 176 160 170 M104 192 C118 196 138 196 152 192" fill="none" stroke="#b89a68" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 58 L136 52 M118 44 L132 38 M124 32 L132 30" stroke="#b89a68" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 200 C206 202 222 196 232 182 M196 216 C212 216 230 206 240 192" fill="none" stroke="#6a7088" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 100 C200 130 200 180 172 212 C198 196 210 140 190 108 Z" fill="#6a7088" opacity="0.5"/>
  <ellipse cx="100" cy="34" rx="12" ry="6" fill="#fff" opacity="0.4" transform="rotate(-30 100 34)"/>
  <!-- eyes + open mouth -->
  <path d="M90 58 C96 52 106 54 110 62 C104 68 94 66 90 58 Z" fill="#fff" stroke="#2b2433" stroke-width="3"/>
  <path d="M166 58 C160 52 150 54 146 62 C152 68 162 66 166 58 Z" fill="#fff" stroke="#2b2433" stroke-width="3"/>
  <circle cx="101" cy="60" r="3.5" fill="#d83a3a"/>
  <circle cx="155" cy="60" r="3.5" fill="#d83a3a"/>
  <path d="M104 82 C114 78 142 78 152 82 C150 98 106 98 104 82 Z" fill="#a0608a" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <path d="M108 82 l4 7 l4 -7 Z M140 82 l4 7 l4 -7 Z" fill="#fff"/>
  <!-- claws -->
  <path d="M30 86 l-8 -8 l12 0 Z M38 80 l-2 -10 l10 6 Z M226 86 l8 -8 l-12 0 Z M218 80 l2 -10 l-10 6 Z" fill="#fff" stroke="#2b2433" stroke-width="2"/>
  <path d="M70 242 l2 -10 l8 10 Z M88 242 l2 -10 l8 10 Z M186 242 l-2 -10 l-8 10 Z M168 242 l-2 -10 l-8 10 Z" fill="#fff" stroke="#2b2433" stroke-width="2"/>
</svg>
