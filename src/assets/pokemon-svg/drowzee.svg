<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffda6c"/><stop offset="1" stop-color="#e4a92c"/></linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a06a40"/><stop offset="1" stop-color="#6c4226"/></linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <path d="M82 52 C74 36 78 20 88 12 C102 20 110 34 108 46 Z" fill="url(#skin)"/>
    <path d="M174 52 C182 36 178 20 168 12 C154 20 146 34 148 46 Z" fill="#e8b23a"/>
