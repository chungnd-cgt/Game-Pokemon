    <ellipse cx="112" cy="160" rx="58" ry="40" fill="url(#cream)"/>
    <path d="M54 158 C52 122 80 106 112 106 C144 106 172 122 170 158 C146 172 78 172 54 158 Z" fill="url(#shell)"/>
    <!-- mắt -->
    <circle cx="83" cy="68" r="12" fill="#2b2433"/>
    <circle cx="141" cy="68" r="12" fill="#2b2433"/>
  </g>
  <circle cx="79" cy="64" r="4" fill="#fff"/>
  <circle cx="137" cy="64" r="4" fill="#fff"/>
  <!-- u sần trên càng to -->
  <g fill="#ff9e78" stroke="#a8341c" stroke-width="3">
    <circle cx="182" cy="128" r="9"/><circle cx="210" cy="118" r="10"/><circle cx="236" cy="134" r="8"/>
    <circle cx="232" cy="96" r="8"/><circle cx="228" cy="60" r="7.5"/><circle cx="210" cy="32" r="6.5"/>
