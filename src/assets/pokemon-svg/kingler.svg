<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff8c5e"/>
      <stop offset="0.6" stop-color="#e8552e"/>
      <stop offset="1" stop-color="#c03e22"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8c5e"/>
      <stop offset="0.55" stop-color="#e05030"/>
      <stop offset="0.56" stop-color="#f8e2b6"/>
      <stop offset="1" stop-color="#e8c890"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeac4"/>
      <stop offset="1" stop-color="#e6c48c"/>
    </linearGradient>
  </defs>
  <!-- chân -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 188 L52 220 L58 242 M94 196 L86 242 M130 196 L138 242 M146 190 L166 222 L160 242" stroke="#2b2433" stroke-width="19"/>
    <path d="M76 188 L52 220 L58 242 M94 196 L86 242 M130 196 L138 242 M146 190 L166 222 L160 242" stroke="#f2c890" stroke-width="9"/>
  </g>
