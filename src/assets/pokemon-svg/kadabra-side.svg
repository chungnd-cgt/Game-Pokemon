  <path d="M144 58 C150 80 140 98 122 106 C140 106 152 90 150 70 Z" fill="#d8b028"/>
  <path d="M232 112 C236 140 222 170 188 186" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
