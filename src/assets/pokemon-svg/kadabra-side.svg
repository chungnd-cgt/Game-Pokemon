  <path d="M104 46 L107.5 54 L116 54 L109.5 59 L112 67 L104 62 L96 67 L98.5 59 L92 54 L100.5 54 Z" fill="#e04848" stroke="#2b2433" stroke-width="2" stroke-linejoin="round"/>
