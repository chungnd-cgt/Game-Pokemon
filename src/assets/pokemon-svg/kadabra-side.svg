    <!-- giáp vai -->
    <path d="M104 118 C98 100 114 90 132 96 C142 102 140 118 128 122 C118 126 108 126 104 118 Z" fill="#8a7466"/>
    <!-- tai -->
    <path d="M118 62 C116 42 120 22 128 4 C142 18 150 36 148 54 Z" fill="url(#skin)"/>
    <!-- đầu, mõm nhọn hướng trái -->
    <path d="M150 70 C150 50 136 38 118 38 C98 38 86 50 82 64 L60 74 C54 78 56 86 62 88 L86 92 C96 102 108 106 120 106 C138 106 150 90 150 70 Z" fill="url(#skin)"/>
