    <path d="M52 96 C56 66 88 50 126 50 C168 50 196 76 196 108 C196 140 168 162 126 162 C98 162 74 154 60 140 C48 136 40 124 44 114 C44 106 46 100 52 96 Z" fill="url(#fur)"/>
  </g>
  <path d="M68 20 C82 30 96 42 106 56 C96 58 88 62 82 68 C76 52 70 36 68 20 Z" fill="#5a3426"/>
  <!-- bóng gáy và lưng -->
  <path d="M182 80 C200 104 198 140 174 154 C158 164 140 166 124 164 C160 150 184 122 182 80 Z" fill="#e8d098" opacity="0.6"/>
  <path d="M154 172 C164 196 162 226 140 236 C156 222 160 196 154 172 Z" fill="#e8d098" opacity="0.8"/>
  <ellipse cx="108" cy="70" rx="24" ry="9" fill="#fff" opacity="0.5" transform="rotate(-14 108 70)"/>
