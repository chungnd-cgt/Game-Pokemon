  <ellipse cx="64" cy="74" rx="14" ry="21" fill="url(#coin)" stroke="#2b2433" stroke-width="4.5" transform="rotate(-22 64 74)"/>
  <ellipse cx="64" cy="74" rx="7" ry="12" fill="none" stroke="#c8901c" stroke-width="3" transform="rotate(-22 64 74)"/>
  <ellipse cx="60" cy="66" rx="3" ry="5" fill="#fff" opacity="0.8"/>
