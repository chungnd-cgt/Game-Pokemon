  <path d="M48 128 Q58 138 70 128" fill="none" stroke="#2b2433" stroke-width="4" stroke-linecap="round"/>
  <path d="M55 132 L57 140 L60 133 Z" fill="#fff" stroke="#2b2433" stroke-width="2" stroke-linejoin="round"/>
