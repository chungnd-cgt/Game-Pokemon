    <radialGradient id="coin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="0.6" stop-color="#f0c038"/>
      <stop offset="1" stop-color="#c8901c"/>
    </radialGradient>
  </defs>
  <!-- đuôi dài cong chữ S sau lưng, chóp nâu -->
