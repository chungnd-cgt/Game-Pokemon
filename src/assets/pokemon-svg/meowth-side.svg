  <path d="M66 106 C72 92 92 90 102 104 C94 118 76 118 66 106 Z" fill="#fff" stroke="#2b2433" stroke-width="4"/>
  <ellipse cx="82" cy="105" rx="4" ry="11" fill="#2b2433"/>
