    <path d="M90 140 C78 172 94 200 126 204 C136 196 132 186 122 184 C108 180 104 164 108 146 Z" fill="url(#skin)"/>
    <path d="M166 140 C178 172 162 200 130 204 C120 196 124 186 134 184 C148 180 152 164 148 146 Z" fill="#f6d03c"/>
    <!-- giáp vai xám nâu -->
    <path d="M70 138 C64 116 86 104 110 110 C124 116 122 136 108 142 C94 148 76 148 70 138 Z" fill="#8a7466"/>
    <path d="M186 138 C192 116 170 104 146 110 C132 116 134 136 148 142 C162 148 180 148 186 138 Z" fill="#8a7466"/>
    <!-- tai nhọn to -->
    <path d="M86 78 C80 52 80 28 88 6 C108 20 124 34 132 50 Z" fill="url(#skin)"/>
    <path d="M170 78 C176 52 176 28 168 6 C148 20 132 34 124 50 Z" fill="#f6d03c"/>
    <!-- đầu -->
    <path d="M82 90 C80 60 100 42 128 42 C156 42 176 60 174 90 C172 112 152 126 128 126 C104 126 84 112 82 90 Z" fill="url(#skin)"/>
  </g>
  <!-- trong tai nâu -->
  <path d="M92 60 C90 46 90 32 94 20 C104 30 112 38 116 46 Z" fill="#9a7450"/>
  <path d="M164 60 C166 46 166 32 162 20 C152 30 144 38 140 46 Z" fill="#9a7450"/>
  <!-- vòng nâu trên đuôi -->
  <path d="M204 176 L222 160 L232 172 L214 188 Z" fill="#5a4236" stroke="#2b2433" stroke-width="3" stroke-linejoin="round"/>
  <!-- bóng & sáng -->
  <path d="M164 74 C176 96 168 118 140 126 C162 126 176 108 174 88 Z" fill="#d8b028"/>
  <ellipse cx="104" cy="60" rx="14" ry="6" fill="#fff" opacity="0.55" transform="rotate(-30 104 60)"/>
  <path d="M230 100 C228 130 214 160 186 182" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="96" cy="120" rx="10" ry="4" fill="#fff" opacity="0.35" transform="rotate(-20 96 120)"/>
  <!-- mắt nhắm (đang ngủ) -->
  <g fill="none" stroke="#2b2433" stroke-width="4.5" stroke-linecap="round">
    <path d="M98 86 Q108 94 118 86"/>
    <path d="M138 86 Q148 94 158 86"/>
  </g>
  <!-- mõm nhỏ -->
  <path d="M114 104 C118 96 138 96 142 104 C140 116 116 116 114 104 Z" fill="#fce670" stroke="#2b2433" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="128" cy="102" rx="4" ry="3" fill="#2b2433"/>
  <!-- móng -->
  <g fill="#fff" stroke="#2b2433" stroke-width="2" stroke-linejoin="round">
    <path d="M28 206 L20 202 L26 212 Z M24 228 L16 230 L26 234 Z M208 220 L218 218 L212 226 Z M212 242 L222 244 L214 236 Z"/>
