<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8a274"/>
      <stop offset="0.6" stop-color="#ac8458"/>
      <stop offset="1" stop-color="#86623e"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a7462"/>
      <stop offset="1" stop-color="#5e4c3e"/>
