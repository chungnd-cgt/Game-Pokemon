    <path d="M152 72 C152 46 134 32 112 34 C94 36 82 46 76 58 C62 62 50 72 50 84 C52 96 62 100 76 100 L112 104 C136 106 152 96 152 72 Z" fill="url(#skin)"/>
  </g>
  <path d="M104 50 C110 38 126 32 142 38 C152 46 156 60 152 76 C140 64 122 56 104 50 Z" fill="url(#plate)" stroke="#2b2433" stroke-width="3.5" stroke-linejoin="round"/>
