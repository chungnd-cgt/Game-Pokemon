<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d89a58"/><stop offset="1" stop-color="#8a5226"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#aeaebe"/></linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8d2c8"/></linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- dark back fins poking out behind the shoulders -->
    <path d="M150 150 L196 168 L156 176 Z" fill="#6e4020"/>
    <path d="M148 170 L188 196 L150 192 Z" fill="#6e4020"/>
    <!-- thin bent legs, white claws -->
    <path d="M120 192 L96 214 L104 238" fill="none" stroke-width="18"/>
    <path d="M120 192 L96 214 L104 238" fill="none" stroke="#c08446" stroke-width="9"/>
    <path d="M136 192 L160 214 L152 238" fill="none" stroke-width="18"/>
    <path d="M136 192 L160 214 L152 238" fill="none" stroke="#8a5226" stroke-width="9"/>
    <path d="M104 236 L84 248 L98 246 L102 254 L110 244 L118 250 Z" fill="#fff" stroke-width="4"/>
    <path d="M152 236 L172 248 L158 246 L154 254 L146 244 L138 250 Z" fill="#fff" stroke-width="4"/>
    <!-- slim torso -->
    <path d="M104 132 C98 154 106 182 116 196 C122 202 134 202 140 196 C150 182 158 154 152 132 C142 122 114 122 104 132 Z" fill="url(#shell)"/>
    <!-- cream ribbed chest -->
    <path d="M114 134 C110 154 116 178 124 190 C126 193 130 193 132 190 C140 178 146 154 142 134 C134 128 122 128 114 134 Z" fill="url(#chest)" stroke-width="4"/>
    <!-- arms out to the sides -->
    <path d="M106 140 L72 122 L54 138" fill="none" stroke-width="18"/>
    <path d="M106 140 L72 122 L54 138" fill="none" stroke="#c08446" stroke-width="9"/>
    <path d="M150 140 L184 122 L202 138" fill="none" stroke-width="18"/>
    <path d="M150 140 L184 122 L202 138" fill="none" stroke="#8a5226" stroke-width="9"/>
    <!-- big scythe blades curving down from the wrists -->
    <path d="M62 126 C26 132 4 172 22 238 C26 196 38 166 64 150 Z" fill="url(#blade)"/>
    <path d="M194 126 C230 132 252 172 234 238 C230 196 218 166 192 150 Z" fill="url(#blade)"/>
    <!-- face under the helmet -->
    <path d="M100 100 C104 118 116 132 128 134 C140 132 152 118 156 100 Z" fill="url(#shell)"/>
    <!-- helmet: pointed tent shape, peak swept up and to the side -->
    <path d="M60 104 C78 76 112 46 168 14 C164 40 170 62 196 96 C176 104 160 108 144 106 C138 102 118 102 112 106 C94 110 78 110 60 104 Z" fill="url(#shell)"/>
  </g>
  <!-- helmet ridge and shading -->
  <path d="M168 14 C150 52 136 78 128 104" fill="none" stroke="#2b2433" stroke-width="4" stroke-linecap="round"/>
  <path d="M168 14 C164 40 170 62 196 96 C176 104 160 108 144 106 C136 104 132 104 128 104 C140 78 156 46 168 14 Z" fill="#5e3416" opacity="0.4"/>
  <path d="M78 96 C96 78 116 62 140 46" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- chest rib lines -->
  <path d="M118 146 L126 148 M138 146 L130 148 M119 160 L126 162 M137 160 L130 162 M121 174 L127 176 M135 174 L129 176" stroke="#2b2433" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M128 140 L128 186" stroke="#2b2433" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 132 C158 154 152 180 138 196 C134 200 130 200 126 200 C144 184 152 160 150 132 Z" fill="#5e3416" opacity="0.4"/>
  <!-- blade edges -->
  <path d="M20 210 C22 180 34 160 56 146 M236 210 C234 180 222 160 200 146" fill="none" stroke="#8c8c9c" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- small fierce eyes under the helmet brim -->
  <g stroke="#2b2433" stroke-width="3.5" stroke-linejoin="round">
    <path d="M100 104 L124 111 C124 122 117 127 110 125 C103 122 100 115 100 104 Z" fill="#fff"/>
    <path d="M156 104 L132 111 C132 122 139 127 146 125 C153 122 156 115 156 104 Z" fill="#fff"/>
  </g>
  <ellipse cx="116" cy="117" rx="4.5" ry="5" fill="#2b2433"/>
  <ellipse cx="140" cy="117" rx="4.5" ry="5" fill="#2b2433"/>
  <circle cx="117" cy="115" r="1.6" fill="#fff"/>
  <circle cx="141" cy="115" r="1.6" fill="#fff"/>
</svg>
