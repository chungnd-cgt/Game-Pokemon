<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d89a58"/><stop offset="1" stop-color="#8a5226"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#aeaebe"/></linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cac6d2"/></linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail with spike, behind -->
    <path d="M146 196 C170 212 200 222 232 222" fill="none" stroke-width="18"/>
    <path d="M146 196 C170 212 200 222 232 222" fill="none" stroke="#a46632" stroke-width="9"/>
    <path d="M224 210 L254 222 L224 234 Z" fill="#8a5226"/>
    <!-- dorsal fins behind the shoulders -->
    <path d="M108 150 L62 124 L102 174 Z" fill="#b0743c"/>
    <path d="M148 150 L194 124 L154 174 Z" fill="#8a5226"/>
    <!-- thin digitigrade legs -->
    <path d="M114 192 C102 206 92 214 94 228 L78 248 L112 248 L110 230 C112 220 120 210 126 200 Z" fill="url(#shell)"/>
    <path d="M142 192 C154 206 164 214 162 228 L178 248 L144 248 L146 230 C144 220 136 210 130 200 Z" fill="#8a5226"/>
    <!-- torso -->
    <path d="M102 138 C94 160 100 188 114 198 C122 204 134 204 142 198 C156 188 162 160 154 138 C146 128 110 128 102 138 Z" fill="url(#shell)"/>
    <!-- white chest plate -->
    <path d="M113 140 C109 160 113 182 122 193 C126 196 130 196 134 193 C143 182 147 160 143 140 C136 134 120 134 113 140 Z" fill="url(#chest)" stroke-width="4"/>
    <!-- arms -->
    <path d="M106 146 C92 152 82 160 76 172" fill="none" stroke-width="18"/>
    <path d="M106 146 C92 152 82 160 76 172" fill="none" stroke="#c2844a" stroke-width="9"/>
    <path d="M150 146 C164 152 174 160 180 172" fill="none" stroke-width="18"/>
    <path d="M150 146 C164 152 174 160 180 172" fill="none" stroke="#8a5226" stroke-width="9"/>
    <!-- scythes -->
    <path d="M86 158 C46 160 20 188 12 240 C34 210 56 194 88 186 Z" fill="url(#blade)"/>
    <path d="M170 158 C210 160 236 188 244 240 C222 210 200 194 168 186 Z" fill="url(#blade)"/>
    <!-- neck -->
    <path d="M116 112 L118 140 L138 140 L140 112 Z" fill="#a46632"/>
    <!-- face below the crest -->
    <path d="M80 96 C84 118 102 134 124 138 C146 134 160 118 164 94 Z" fill="url(#shell)"/>
    <!-- head: flat sickle-shaped crest, front point hooks down over the face, long point swept back -->
    <path d="M50 116 C40 90 56 62 92 52 C138 40 196 38 248 18 C232 52 198 78 160 92 C134 100 104 104 78 102 C66 104 58 110 50 116 Z" fill="url(#shell)"/>
  </g>
  <!-- chest: black rib lines -->
  <path d="M118 150 L126 152 M138 150 L130 152 M117 164 L125 166 M139 164 L131 166 M119 178 L126 180 M137 178 L130 180" stroke="#2b2433" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M128 146 L128 188" stroke="#2b2433" stroke-width="3" stroke-linecap="round"/>
  <!-- blade edge -->
  <path d="M26 212 C40 192 60 180 86 172 M230 212 C216 192 196 180 170 172" fill="none" stroke="#8c8c9c" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- shading and gloss -->
  <path d="M150 128 C162 152 158 180 140 196 C134 200 126 202 118 202 C144 186 152 158 150 128 Z" fill="#5e3416" opacity="0.4"/>
  <path d="M134 50 C176 46 214 36 242 24 C226 54 196 76 160 90 C148 94 138 96 128 98 C146 84 148 66 134 50 Z" fill="#5e3416" opacity="0.4"/>
  <path d="M60 84 C68 68 84 60 108 54" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- eyes: white with black pupils, under the crest rim -->
  <g stroke="#2b2433" stroke-width="3.5" stroke-linejoin="round">
    <path d="M90 106 L114 110 C114 120 108 124 102 123 C95 122 90 116 90 106 Z" fill="#fff"/>
    <path d="M154 104 L132 110 C133 120 139 124 145 122 C151 120 155 114 154 104 Z" fill="#fff"/>
  </g>
  <ellipse cx="104" cy="115" rx="4" ry="5" fill="#2b2433"/>
  <ellipse cx="141" cy="114" rx="4" ry="5" fill="#2b2433"/>
  <circle cx="105" cy="113" r="1.6" fill="#fff"/>
  <circle cx="142" cy="112" r="1.6" fill="#fff"/>
</svg>
