<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcc4d0"/>
      <stop offset="1" stop-color="#f0a0b4"/>
    </linearGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6aed6"/>
      <stop offset="1" stop-color="#e888c0"/>
    </linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail behind, sweeping up on the right -->
    <path d="M190 160 C222 140 240 104 230 70 C250 88 254 150 226 196 Z" fill="#d87c96"/>
    <!-- feet -->
    <ellipse cx="82" cy="234" rx="32" ry="13" fill="#e690a8"/>
    <ellipse cx="174" cy="234" rx="32" ry="13" fill="#d87c96"/>
    <!-- body -->
    <path d="M128 22 C160 22 176 46 178 76 C206 100 222 150 220 196 C218 228 190 238 128 238 C66 238 38 228 36 196 C34 150 50 100 78 76 C80 46 96 22 128 22 Z" fill="url(#skin)"/>
    <!-- arms -->
    <path d="M60 104 C40 104 26 116 28 128 C30 138 44 140 54 134 C64 128 72 116 60 104 Z" fill="#f4b0c0"/>
    <path d="M196 104 C216 104 230 116 228 128 C226 138 212 140 202 134 C192 128 184 116 196 104 Z" fill="#e690a8"/>
  </g>
  <!-- cream belly bands -->
  <ellipse cx="128" cy="178" rx="64" ry="54" fill="#f8eeb4"/>
  <path d="M72 158 C100 170 156 170 184 158 M66 184 C96 198 160 198 190 184 M76 210 C100 222 156 222 180 210" fill="none" stroke="#f0a0b4" stroke-width="10" stroke-linecap="round"/>
  <path d="M190 120 C210 150 212 200 196 226 C214 210 220 160 204 124 Z" fill="#d87c96" opacity="0.6"/>
  <ellipse cx="98" cy="40" rx="14" ry="8" fill="#fff" opacity="0.5" transform="rotate(-30 98 40)"/>
  <!-- knee circle -->
  <circle cx="190" cy="212" r="14" fill="#f8eeb4" stroke="#2b2433" stroke-width="3"/>
  <circle cx="190" cy="212" r="6" fill="#f0a0b4"/>
  <!-- claws -->
  <path d="M30 124 l-8 4 l8 3 Z M226 124 l8 4 l-8 3 Z M58 244 l-4 6 l10 -2 Z M86 246 l0 6 l8 -4 Z M168 246 l0 6 l-8 -4 Z M196 244 l4 6 l-10 -2 Z" fill="#fff" stroke="#2b2433" stroke-width="2"/>
  <!-- mouth + huge tongue -->
  <path d="M90 70 C108 92 148 92 166 70 C150 80 106 80 90 70 Z" fill="#7a2a44" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <path d="M110 80 C104 120 92 168 84 208 C80 230 98 244 116 234 C128 226 124 212 126 198 C130 160 144 116 150 80 C138 86 122 86 110 80 Z" fill="url(#tongue)" stroke="#2b2433" stroke-width="5" stroke-linejoin="round"/>
  <path d="M128 92 C124 130 112 170 106 210" fill="none" stroke="#c86aa0" stroke-width="4" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="106" cy="46" rx="6" ry="8" fill="#2b2433"/>
  <ellipse cx="150" cy="46" rx="6" ry="8" fill="#2b2433"/>
  <circle cx="104" cy="43" r="2.5" fill="#fff"/>
  <circle cx="148" cy="43" r="2.5" fill="#fff"/>
</svg>
