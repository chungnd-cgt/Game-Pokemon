  <ellipse cx="106" cy="126" rx="6" ry="4" fill="#4a3a6a"/>
  <path d="M86 136 Q106 150 126 136" fill="#e07890" stroke="#2b2433" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M97 140 L97 152 L105 152 L105 143 Z M107 143 L107 152 L115 152 L115 140 Z" fill="#fff" stroke="#2b2433" stroke-width="2.5" stroke-linejoin="round"/>
