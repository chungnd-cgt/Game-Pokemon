<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe4fa"/>
      <stop offset="1" stop-color="#a4b0e6"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36a6a8"/>
      <stop offset="1" stop-color="#22707e"/>
    </linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- gai lưng nhỏ nhô sau thân -->
    <path d="M196 146 L224 128 L214 160 Z" fill="#c4ccf2"/>
    <path d="M214 170 L242 162 L222 190 Z" fill="#c4ccf2"/>
    <!-- chân sau phía xa -->
    <path d="M196 200 C200 220 202 234 200 246 L224 246 C226 230 224 214 218 198 Z" fill="#94a2dc"/>
    <!-- chân trước -->
    <path d="M70 176 C68 204 70 230 72 246 L102 246 C104 228 104 204 100 182 Z" fill="url(#skin)"/>
    <path d="M118 184 C116 208 118 232 120 246 L150 246 C150 226 150 204 146 186 Z" fill="#b4bfec"/>
    <!-- thân tròn -->
    <ellipse cx="150" cy="174" rx="76" ry="52" fill="url(#skin)"/>
    <!-- chân sau phía gần -->
    <path d="M158 206 C160 224 160 236 158 246 L190 246 C192 232 190 216 186 204 Z" fill="#b4bfec"/>
    <!-- tai phía xa (bên phải, to, lòng xanh ngọc) -->
    <ellipse cx="186" cy="74" rx="36" ry="48" fill="#c4ccf2" transform="rotate(48 186 74)"/>
    <ellipse cx="190" cy="72" rx="24" ry="36" fill="url(#ear)" transform="rotate(48 190 72)"/>
    <!-- tai phía gần (bên trái, nhỏ) -->
    <ellipse cx="54" cy="70" rx="20" ry="34" fill="#c4ccf2" transform="rotate(-36 54 70)"/>
    <ellipse cx="56" cy="72" rx="11" ry="23" fill="url(#ear)" stroke="none" transform="rotate(-36 56 72)"/>
    <!-- sừng nhỏ -->
    <path d="M96 64 L104 34 L118 62 Z" fill="#e8ecfc"/>
    <!-- đầu -->
    <path d="M42 112 C40 78 70 56 108 56 C146 56 170 80 168 114 C166 146 140 164 106 164 C70 164 44 146 42 112 Z" fill="url(#skin)"/>
  </g>
  <!-- bóng thân / đầu -->
  <path d="M204 150 C222 176 216 214 186 232 C210 206 214 178 204 150 Z" fill="#7c88c8" opacity="0.6"/>
  <path d="M160 92 C172 122 156 152 124 162 C150 140 160 118 160 92 Z" fill="#7c88c8" opacity="0.5"/>
  <ellipse cx="80" cy="76" rx="20" ry="8" fill="#fff" opacity="0.55" transform="rotate(-24 80 76)"/>
