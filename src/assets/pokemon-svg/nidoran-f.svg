  <g fill="#5c62b4">
    <ellipse cx="168" cy="160" rx="11" ry="8" transform="rotate(-20 168 160)"/>
    <ellipse cx="196" cy="186" rx="9" ry="12"/>
    <ellipse cx="174" cy="206" rx="7" ry="6"/>
    <ellipse cx="146" cy="78" rx="7" ry="5" transform="rotate(20 146 78)"/>
    <ellipse cx="86" cy="208" rx="5" ry="6"/>
  </g>
  <!-- móng trắng -->
  <path d="M74 246 l5 -9 l5 9 Z M88 246 l5 -9 l5 9 Z M122 246 l5 -9 l5 9 Z M136 246 l5 -9 l5 9 Z M164 246 l5 -9 l5 9 Z M176 246 l5 -9 l5 9 Z" fill="#fff" stroke="#2b2433" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- mắt đỏ -->
  <g stroke="#2b2433" stroke-width="4">
    <ellipse cx="80" cy="106" rx="12" ry="14" fill="#fff"/>
    <ellipse cx="132" cy="106" rx="12" ry="14" fill="#fff"/>
  </g>
  <ellipse cx="82" cy="108" rx="8" ry="10" fill="#d4303e"/>
  <ellipse cx="130" cy="108" rx="8" ry="10" fill="#d4303e"/>
  <ellipse cx="82" cy="110" rx="4" ry="5" fill="#2b2433"/>
  <ellipse cx="130" cy="110" rx="4" ry="5" fill="#2b2433"/>
  <circle cx="85" cy="103" r="3.5" fill="#fff"/>
  <circle cx="133" cy="103" r="3.5" fill="#fff"/>
  <!-- râu -->
  <path d="M52 126 L32 122 M54 136 L34 140 M156 126 L176 122 M154 136 L174 140" stroke="#5c62b4" stroke-width="3" stroke-linecap="round"/>
