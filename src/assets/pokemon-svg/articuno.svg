    <path d="M114 96 L112 124 L144 124 L142 96 Z" fill="#8ccaf4"/>
    <ellipse cx="128" cy="78" rx="30" ry="28" fill="url(#skin)"/>
  </g>
  <!-- chest -->
  <path d="M106 142 C102 166 110 192 128 198 C146 192 154 166 150 142 C140 134 116 134 106 142 Z" fill="#e2f4ff"/>
  <!-- wing feather lines -->
  <path d="M28 100 C56 108 82 118 104 132 M38 128 C62 130 86 134 106 140 M56 154 C74 148 92 144 108 144 M228 100 C200 108 174 118 152 132 M218 128 C194 130 170 134 150 140 M200 154 C182 148 164 144 148 144" fill="none" stroke="#2f6cbc" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 230 C82 228 100 222 116 210 M196 232 C176 228 158 222 142 210" fill="none" stroke="#2c5cb0" stroke-width="4" stroke-linecap="round"/>
