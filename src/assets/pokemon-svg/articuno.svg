    <path d="M118 56 C104 34 108 14 124 2 C122 22 128 34 134 46 Z" fill="url(#crest)"/>
    <path d="M128 52 C126 30 136 12 156 4 C146 22 146 38 144 54 Z" fill="url(#crest)"/>
    <path d="M136 56 C146 38 164 30 184 32 C168 42 160 54 152 66 Z" fill="url(#crest)"/>
