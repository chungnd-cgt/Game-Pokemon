<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aee0fc"/><stop offset="1" stop-color="#4c9ee0"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4dafa"/><stop offset="1" stop-color="#4a92dc"/></linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a7cd0"/><stop offset="1" stop-color="#22449a"/></linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- one long tail ribbon sweeping down and curling out to the right -->
    <path d="M118 186 C106 222 128 246 170 248 C208 250 238 232 248 200 C234 218 208 226 180 222 C152 218 140 206 138 186 Z" fill="#5aa4e4"/>
    <path d="M134 196 C146 214 170 222 200 220 C220 218 236 210 248 200 C238 228 210 244 176 242 C150 240 136 224 134 196 Z" fill="#3e86d4"/>
    <!-- wings raised up and out -->
    <path d="M112 128 C96 96 60 46 12 12 C12 36 18 54 28 66 C20 74 22 86 32 92 C28 104 34 116 46 120 C46 134 56 144 70 144 C80 150 96 150 112 148 Z" fill="url(#wing)"/>
    <path d="M144 128 C160 96 196 46 244 12 C244 36 238 54 228 66 C236 74 234 86 224 92 C228 104 222 116 210 120 C210 134 200 144 186 144 C176 150 160 150 144 148 Z" fill="url(#wing)"/>
    <!-- legs -->
    <path d="M114 196 L110 228 M142 196 L146 228" fill="none" stroke-width="12"/>
    <path d="M114 196 L110 228 M142 196 L146 228" fill="none" stroke="#8a9cb8" stroke-width="5"/>
    <path d="M110 226 L96 238 M110 226 L110 242 M110 226 L122 238 M146 226 L134 238 M146 226 L146 242 M146 226 L160 238" fill="none" stroke="#2b2433" stroke-width="5"/>
    <!-- body -->
    <ellipse cx="128" cy="158" rx="36" ry="46" fill="url(#skin)"/>
    <!-- crest -->
    <path d="M118 56 C104 34 108 14 124 2 C122 22 128 34 134 46 Z" fill="url(#crest)"/>
    <path d="M128 52 C126 30 136 12 156 4 C146 22 146 38 144 54 Z" fill="url(#crest)"/>
    <path d="M136 56 C146 38 164 30 184 32 C168 42 160 54 152 66 Z" fill="url(#crest)"/>
    <!-- neck + head -->
    <path d="M114 96 L112 124 L144 124 L142 96 Z" fill="#8ccaf4"/>
    <ellipse cx="128" cy="78" rx="30" ry="28" fill="url(#skin)"/>
  </g>
  <!-- chest -->
  <path d="M106 142 C102 166 110 192 128 198 C146 192 154 166 150 142 C140 134 116 134 106 142 Z" fill="#e2f4ff"/>
  <!-- wing feather lines -->
  <path d="M28 66 C58 84 86 104 106 128 M32 92 C60 104 86 118 106 136 M46 120 C70 126 90 134 108 142 M228 66 C198 84 170 104 150 128 M224 92 C196 104 170 118 150 136 M210 120 C186 126 166 134 148 142" fill="none" stroke="#2f6cbc" stroke-width="4" stroke-linecap="round"/>
  <path d="M128 214 C142 230 170 236 200 232" fill="none" stroke="#2c5cb0" stroke-width="4" stroke-linecap="round"/>
  <!-- shading -->
  <path d="M150 124 C166 146 166 180 150 196 C144 202 136 204 128 204 C152 184 158 152 150 124 Z" fill="#2c6ab8" opacity="0.4"/>
  <ellipse cx="114" cy="62" rx="12" ry="6" fill="#fff" opacity="0.5" transform="rotate(-20 114 62)"/>
  <ellipse cx="50" cy="56" rx="18" ry="5" fill="#fff" opacity="0.45" transform="rotate(40 50 56)"/>
  <!-- eyes -->
  <g stroke="#2b2433" stroke-width="4" stroke-linejoin="round">
    <path d="M104 70 L122 78 C122 88 116 92 110 92 C104 92 102 84 104 70 Z" fill="#c8202a"/>
    <path d="M152 70 L134 78 C134 88 140 92 146 92 C152 92 154 84 152 70 Z" fill="#c8202a"/>
  </g>
  <circle cx="112" cy="80" r="2.6" fill="#fff"/>
  <circle cx="144" cy="80" r="2.6" fill="#fff"/>
  <!-- beak -->
  <path d="M118 90 L138 90 L128 106 Z" fill="#9aa2b0" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
</svg>
