  <path d="M150 124 C166 146 166 180 150 196 C144 202 136 204 128 204 C152 184 158 152 150 124 Z" fill="#2c6ab8" opacity="0.4"/>
  <ellipse cx="114" cy="62" rx="12" ry="6" fill="#fff" opacity="0.5" transform="rotate(-20 114 62)"/>
  <ellipse cx="56" cy="76" rx="18" ry="5" fill="#fff" opacity="0.45" transform="rotate(25 56 76)"/>
  <!-- eyes -->
  <g stroke="#2b2433" stroke-width="4" stroke-linejoin="round">
    <path d="M104 70 L122 78 C122 88 116 92 110 92 C104 92 102 84 104 70 Z" fill="#c8202a"/>
    <path d="M152 70 L134 78 C134 88 140 92 146 92 C152 92 154 84 152 70 Z" fill="#c8202a"/>
  </g>
  <circle cx="112" cy="80" r="2.6" fill="#fff"/>
  <circle cx="144" cy="80" r="2.6" fill="#fff"/>
  <!-- beak -->
  <path d="M118 90 L138 90 L128 106 Z" fill="#9aa2b0" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
