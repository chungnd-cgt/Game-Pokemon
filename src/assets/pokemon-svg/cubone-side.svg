<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcb078"/>
      <stop offset="1" stop-color="#c08a52"/>
    </linearGradient>
    <radialGradient id="skull" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8d6e2"/>
    </radialGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M176 200 C204 204 222 196 232 180 C236 200 222 226 184 228 Z" fill="#b07c48"/>
    <!-- feet -->
    <ellipse cx="150" cy="236" rx="26" ry="11" fill="#b07c48"/>
    <ellipse cx="102" cy="238" rx="28" ry="11" fill="#c08a52"/>
    <!-- body -->
    <path d="M128 124 C168 124 190 156 188 192 C186 222 160 238 126 238 C92 238 70 222 70 192 C70 156 90 124 128 124 Z" fill="url(#skin)"/>
    <path d="M92 156 C110 152 122 172 120 200 C118 222 104 232 86 228 C76 210 76 176 92 156 Z" fill="#f4e8c4"/>
    <!-- skull in profile: long snout pointing left-down -->
    <path d="M140 12 C176 12 200 36 200 70 C200 96 186 116 166 124 L120 136 C100 140 76 146 58 140 C40 134 34 116 44 102 C52 90 68 84 80 74 C90 36 108 12 140 12 Z" fill="url(#skull)"/>
    <!-- horn -->
    <path d="M176 30 L206 6 L198 46 Z" fill="#e8e6f0"/>
    <!-- arm holding the bone forward -->
    <path d="M30 210 L76 148" fill="none" stroke-width="20"/>
    <path d="M30 210 L76 148" fill="none" stroke="#f2eee4" stroke-width="11"/>
    <circle cx="22" cy="208" r="10" fill="#f2eee4"/>
    <circle cx="32" cy="220" r="9" fill="#f2eee4"/>
    <circle cx="78" cy="138" r="9" fill="#f2eee4"/>
    <circle cx="90" cy="146" r="8" fill="#f2eee4"/>
    <path d="M110 160 C98 170 84 176 72 174 C62 172 62 162 72 160 C84 158 94 154 104 146 Z" fill="#c08a52"/>
  </g>
  <!-- eye socket -->
  <path d="M106 68 C112 56 132 54 140 64 C144 78 136 94 122 96 C108 96 102 82 106 68 Z" fill="#8a5c34" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="118" cy="78" rx="6" ry="9" fill="#2b2433"/>
  <circle cx="119" cy="74" r="3" fill="#fff"/>
  <ellipse cx="54" cy="122" rx="5" ry="4" fill="#2b2433"/>
  <path d="M60 140 C70 134 90 132 104 136" fill="none" stroke="#8a5c34" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 16 L146 32 L156 42" fill="none" stroke="#a8a4b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 34 C200 62 196 104 168 122 C186 96 190 64 180 34 Z" fill="#b8b4c8" opacity="0.6"/>
  <ellipse cx="120" cy="30" rx="16" ry="7" fill="#fff" opacity="0.8" transform="rotate(-20 120 30)"/>
  <path d="M166 150 C182 170 182 206 164 226 C178 196 176 172 166 150 Z" fill="#9a6a3e" opacity="0.5"/>
</svg>
