    <path d="M234 116 C242 88 236 60 222 38 C206 52 198 74 198 98 Z" fill="#d84a2a"/>
    <path d="M200 104 C198 84 192 70 180 58 C172 76 172 96 180 112 Z" fill="#f8e2b6"/>
    <ellipse cx="208" cy="124" rx="32" ry="34" fill="url(#claw)"/>
    <!-- gai trên mai -->
    <path d="M110 106 L102 76 L124 102 Z" fill="#e8552e"/>
    <path d="M146 106 L154 76 L132 102 Z" fill="#d84a2a"/>
    <!-- thân: dưới kem -->
    <ellipse cx="128" cy="160" rx="60" ry="42" fill="url(#cream)"/>
    <!-- mai đỏ phía trên -->
    <path d="M68 158 C66 120 94 102 128 102 C162 102 190 120 188 158 C162 172 94 172 68 158 Z" fill="url(#shell)"/>
    <!-- mắt -->
    <circle cx="85" cy="72" r="13" fill="#2b2433"/>
    <circle cx="171" cy="72" r="13" fill="#2b2433"/>
  </g>
  <circle cx="81" cy="67" r="4.5" fill="#fff"/>
  <circle cx="167" cy="67" r="4.5" fill="#fff"/>
