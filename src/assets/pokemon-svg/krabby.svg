    <path d="M84 162 L56 146 M172 162 L200 146" stroke="#2b2433" stroke-width="26"/>
    <path d="M84 162 L56 146 M172 162 L200 146" stroke="#f2c890" stroke-width="16"/>
  </g>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
