  <path d="M168 116 C184 128 190 146 186 158 C176 162 166 164 156 166 C170 150 174 132 168 116 Z" fill="#9c2e18" opacity="0.45"/>
  <ellipse cx="104" cy="120" rx="20" ry="8" fill="#fff" opacity="0.4" transform="rotate(-18 104 120)"/>
  <ellipse cx="36" cy="104" rx="10" ry="5" fill="#fff" opacity="0.4" transform="rotate(-40 36 104)"/>
  <ellipse cx="196" cy="104" rx="10" ry="5" fill="#fff" opacity="0.3" transform="rotate(40 196 104)"/>
