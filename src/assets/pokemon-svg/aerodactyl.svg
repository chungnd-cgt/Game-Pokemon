    <path d="M108 118 L62 40 L4 70" fill="none" stroke="#a898b8" stroke-width="7"/>
    <path d="M148 118 L194 40 L252 70" fill="none" stroke-width="16"/>
    <path d="M148 118 L194 40 L252 70" fill="none" stroke="#a898b8" stroke-width="7"/>
