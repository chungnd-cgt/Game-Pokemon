  <path d="M104 72 L124 70 C124 80 118 84 112 83 C106 82 104 78 104 72 Z" fill="#fff" stroke="#2b2433" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="114" cy="76" rx="3.5" ry="4" fill="#5a2a3a"/>
  <circle cx="113" cy="74.5" r="1.4" fill="#fff"/>
  <path d="M100 70 L126 66" stroke="#2b2433" stroke-width="4.5" stroke-linecap="round"/>
  <!-- nostril -->
  <circle cx="54" cy="80" r="1.8" fill="#2b2433"/>
</svg>
