    <path d="M52 86 C64 92 80 94 96 94 C92 104 84 110 70 112 C60 112 54 108 52 100 Z" fill="#c83040" stroke-width="4"/>
  </g>
  <!-- teeth -->
  <path d="M58 88 L61 96 L64 89 Z M68 90 L71 98 L74 91 Z M78 92 L81 99 L84 92 Z M60 110 L63 102 L66 110 Z M72 110 L75 102 L78 109 Z" fill="#fff" stroke="#2b2433" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- wing membrane folds -->
  <path d="M62 40 L46 132 M62 40 L18 108 M194 40 L210 132 M194 40 L238 108" fill="none" stroke="#5a3e8c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
