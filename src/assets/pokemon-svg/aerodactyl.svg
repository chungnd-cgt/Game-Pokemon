  <path d="M116 124 C110 146 114 172 124 184 C128 186 132 184 134 182 C130 160 130 140 134 122 Z" fill="#fff" opacity="0.25"/>
  <path d="M148 122 C156 144 154 172 140 188 C134 192 128 194 122 194 C142 176 150 150 148 122 Z" fill="#5e4e78" opacity="0.4"/>
