    <path d="M108 118 L62 40 L4 70 C20 82 22 96 18 108 C36 108 44 118 46 132 C64 128 76 136 80 150 C92 146 100 150 106 160 Z" fill="url(#wing)"/>
    <path d="M148 118 L194 40 L252 70 C236 82 234 96 238 108 C220 108 212 118 210 132 C192 128 180 136 176 150 C164 146 156 150 150 160 Z" fill="#7656b0"/>
