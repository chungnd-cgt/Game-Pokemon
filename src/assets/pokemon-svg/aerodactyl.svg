    <path d="M114 182 L106 214 L110 234" fill="none" stroke-width="20"/>
    <path d="M114 182 L106 214 L110 234" fill="none" stroke="#b4a6c6" stroke-width="10"/>
    <path d="M144 182 L152 214 L148 234" fill="none" stroke-width="20"/>
    <path d="M144 182 L152 214 L148 234" fill="none" stroke="#9a8ab0" stroke-width="10"/>
    <path d="M110 232 L94 246 L104 244 L106 252 L114 242 L122 248 Z" fill="#fff" stroke-width="3.5"/>
    <path d="M148 232 L164 246 L154 244 L152 252 L144 242 L136 248 Z" fill="#fff" stroke-width="3.5"/>
    <!-- body -->
    <path d="M104 120 C94 142 98 174 112 188 C122 196 136 196 146 188 C160 174 162 142 152 120 C142 108 114 108 104 120 Z" fill="url(#skin)"/>
    <!-- crest swept back -->
    <path d="M132 74 C150 62 168 56 186 56 C176 66 164 78 146 90 Z" fill="#a898b8"/>
    <!-- long head, turned three-quarters to the left -->
    <path d="M150 84 C150 66 136 56 118 58 C104 60 92 66 80 70 C66 74 54 76 44 80 C46 88 54 92 66 92 L92 96 C88 104 82 110 70 112 C60 114 52 116 50 122 C66 128 92 126 112 118 C132 112 150 104 150 84 Z" fill="url(#skin)"/>
