  <path d="M160 140 L196 130 L178 124 Z M186 120 L214 98 L188 108 Z M100 136 L104 96 L114 120 Z" fill="#2b2433"/>
  <path d="M120 128 C140 100 160 76 176 52 M136 132 C160 116 182 100 202 80" fill="none" stroke="#c88a10" stroke-width="4" stroke-linecap="round"/>
