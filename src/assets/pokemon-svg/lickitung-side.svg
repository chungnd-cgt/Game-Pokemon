<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcc4d0"/>
      <stop offset="1" stop-color="#f0a0b4"/>
    </linearGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6aed6"/>
      <stop offset="1" stop-color="#e888c0"/>
    </linearGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail out the back -->
    <path d="M176 170 C210 166 238 186 246 216 C248 230 236 236 224 230 C208 220 190 214 170 214 Z" fill="#d87c96"/>
    <ellipse cx="160" cy="236" rx="30" ry="12" fill="#d87c96"/>
    <ellipse cx="96" cy="236" rx="32" ry="12" fill="#e690a8"/>
    <!-- body, head leaning forward -->
    <path d="M100 24 C132 22 150 44 152 74 C186 96 202 146 198 192 C196 228 168 240 120 240 C74 240 50 226 50 190 C50 152 60 120 70 100 C64 92 62 80 64 68 C68 40 80 26 100 24 Z" fill="url(#skin)"/>
  </g>
  <!-- belly bands on the front -->
  <path d="M60 140 C84 132 104 150 108 180 C112 210 94 230 70 228 C56 210 52 170 60 140 Z" fill="#f8eeb4"/>
  <path d="M58 156 C76 154 92 160 104 168 M56 186 C76 186 94 192 108 198 M64 214 C78 214 90 218 100 222" fill="none" stroke="#f0a0b4" stroke-width="8" stroke-linecap="round"/>
  <path d="M170 100 C194 132 198 190 176 230 C200 214 206 150 184 108 Z" fill="#d87c96" opacity="0.6"/>
  <ellipse cx="96" cy="40" rx="14" ry="8" fill="#fff" opacity="0.5" transform="rotate(-30 96 40)"/>
  <circle cx="158" cy="210" r="13" fill="#f8eeb4" stroke="#2b2433" stroke-width="3"/>
  <circle cx="158" cy="210" r="5" fill="#f0a0b4"/>
  <!-- arm -->
  <path d="M120 112 C112 128 98 140 84 140 C74 140 74 128 84 122 C96 116 108 110 120 112 Z" fill="#f4b0c0" stroke="#2b2433" stroke-width="5" stroke-linejoin="round"/>
  <path d="M84 132 l-8 4 l8 3 Z M70 244 l-6 4 l10 0 Z" fill="#fff" stroke="#2b2433" stroke-width="2"/>
  <!-- mouth + tongue hanging forward -->
  <path d="M62 72 C74 88 96 92 110 84 C96 82 76 80 62 72 Z" fill="#7a2a44" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <path d="M72 82 C52 96 30 130 22 170 C18 196 28 214 44 208 C56 204 52 188 54 174 C58 140 80 110 100 88 C90 90 80 88 72 82 Z" fill="url(#tongue)" stroke="#2b2433" stroke-width="5" stroke-linejoin="round"/>
  <path d="M80 96 C60 120 44 150 38 190" fill="none" stroke="#c86aa0" stroke-width="4" stroke-linecap="round"/>
  <!-- eye -->
  <ellipse cx="94" cy="48" rx="6" ry="8" fill="#2b2433"/>
  <circle cx="92" cy="45" r="2.5" fill="#fff"/>
</svg>
