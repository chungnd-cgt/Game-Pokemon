    <path d="M170 200 C204 214 228 200 232 170" fill="none" stroke-width="24"/>
    <path d="M170 200 C204 214 228 200 232 170" fill="none" stroke="#f0b81e" stroke-width="14"/>
    <path d="M180 206 C206 212 222 200 226 184" fill="none" stroke="#d43626" stroke-width="5" stroke-linecap="round"/>
    <path d="M232 174 C210 162 210 134 222 116 C226 104 230 94 230 82 C244 98 254 120 252 142 C250 160 242 172 232 174 Z" fill="url(#flame)"/>
