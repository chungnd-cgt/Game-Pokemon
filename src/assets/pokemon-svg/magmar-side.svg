    <path d="M78 126 C74 136 72 146 74 156 L86 146 L92 166 L104 150 L114 170 L124 150 L138 164 L144 146 L158 156 L172 146 C178 132 166 118 146 112 C122 104 92 108 78 126 Z" fill="url(#red)" stroke-width="4"/>
