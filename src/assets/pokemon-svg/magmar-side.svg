    <path d="M76 226 C56 228 44 238 46 246 C48 251 54 252 62 252 L96 252 C104 252 106 246 102 238 C98 230 90 226 76 226 Z" fill="url(#red)"/>
    <path d="M64 220 L98 220 L98 232 L64 232 Z" fill="#2b2433" stroke-width="3"/>
    <ellipse cx="96" cy="194" rx="36" ry="30" fill="url(#skin)"/>
    <!-- black neck collar -->
    <path d="M70 102 Q96 116 120 104 L122 116 Q96 130 70 114 Z" fill="#2b2433" stroke-width="3"/>
    <!-- flame tufts on the head, blowing back -->
    <path d="M100 46 C102 28 118 14 138 10 C130 20 132 30 138 36 C130 44 120 50 108 52 Z" fill="url(#flame)"/>
    <path d="M80 44 C76 26 86 10 102 2 C98 14 102 24 108 30 C102 38 94 44 86 48 Z" fill="url(#flame)"/>
    <!-- red round head -->
    <path d="M64 70 C62 48 80 34 100 34 C122 34 136 50 134 72 C132 94 116 106 96 106 C78 106 66 92 64 70 Z" fill="url(#red)"/>
    <!-- short flat yellow bill -->
    <path d="M70 80 C58 78 44 82 36 90 C42 100 58 104 72 98 Z" fill="#ffe25a"/>
    <!-- near arm reaching forward, flame spikes, white claws -->
    <path d="M104 136 C86 146 72 156 58 166" fill="none" stroke-width="26"/>
    <path d="M104 136 C86 146 72 156 58 166" fill="none" stroke="#ff6a4a" stroke-width="16"/>
    <path d="M86 140 L80 120 L96 134 Z M72 150 L58 134 L78 144 Z" fill="#f05a2a" stroke-width="4"/>
    <path d="M50 162 L28 160 L42 170 L28 180 L50 176 Z" fill="#fff" stroke-width="4"/>
  </g>
  <!-- red flame marks on belly and thigh -->
  <path d="M138 196 C134 184 140 176 146 168 C148 180 156 186 150 198 Z" fill="#e84a2a" stroke="#2b2433" stroke-width="3" stroke-linejoin="round"/>
  <path d="M90 208 C84 196 92 186 98 178 C100 190 108 196 102 210 Z" fill="#e84a2a" stroke="#2b2433" stroke-width="3" stroke-linejoin="round"/>
