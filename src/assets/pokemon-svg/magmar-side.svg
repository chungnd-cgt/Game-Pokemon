    <path d="M150 226 C170 228 182 238 180 246 C178 251 172 252 164 252 L136 252 C130 252 128 246 132 238 C136 230 142 226 150 226 Z" fill="#d43626"/>
    <path d="M138 220 L170 220 L170 232 L138 232 Z" fill="#2b2433" stroke-width="3"/>
    <ellipse cx="156" cy="196" rx="30" ry="28" fill="#f0b81e"/>
