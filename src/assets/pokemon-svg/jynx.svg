    <path d="M90 150 L166 150 C188 182 212 210 230 236 C210 246 190 240 172 246 C154 238 140 248 128 244 C116 248 102 238 84 246 C66 240 46 246 26 236 C44 210 68 182 90 150 Z" fill="url(#dress)"/>
