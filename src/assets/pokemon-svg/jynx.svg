    <path d="M164 130 C158 116 138 116 130 132 C128 140 128 150 128 158 L168 158 C172 148 170 138 164 130 Z" fill="#cc3446"/>
    <!-- big face -->
    <path d="M128 34 C156 34 170 56 168 86 C166 114 150 130 128 130 C106 130 90 114 88 86 C86 56 100 34 128 34 Z" fill="url(#face)"/>
    <!-- fringe parted in the middle -->
    <path d="M128 16 C104 18 88 34 86 60 C96 52 116 38 128 22 C140 38 160 52 170 60 C168 34 152 18 128 16 Z" fill="#f8e898"/>
  </g>
  <path d="M84 40 C74 70 74 120 70 150" fill="none" stroke="#fffbe0" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M176 50 C184 80 186 130 200 162" fill="none" stroke="#d8b85c" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M150 156 C176 186 196 212 210 236 C190 236 176 236 172 242 C166 214 160 186 150 156 Z" fill="#b02a40" opacity="0.5"/>
  <path d="M74 172 C66 188 56 204 44 222" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <!-- eyes -->
  <ellipse cx="112" cy="74" rx="9" ry="10" fill="#fff" stroke="#2b2433" stroke-width="3"/>
  <ellipse cx="144" cy="74" rx="9" ry="10" fill="#fff" stroke="#2b2433" stroke-width="3"/>
  <circle cx="113" cy="76" r="4.5" fill="#2b2433"/>
  <circle cx="143" cy="76" r="4.5" fill="#2b2433"/>
  <!-- big lips -->
  <path d="M106 104 C112 94 122 96 128 99 C134 96 144 94 150 104 C146 118 110 118 106 104 Z" fill="#f46aa0" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <path d="M111 105 C120 108 136 108 145 105" fill="none" stroke="#2b2433" stroke-width="3" stroke-linecap="round"/>
</svg>
