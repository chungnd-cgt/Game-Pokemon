    <path d="M84 132 C66 124 48 124 38 134 C44 148 64 152 86 150 Z" fill="#f4f2f8"/>
    <path d="M172 132 C190 124 208 124 218 134 C212 148 192 152 170 150 Z" fill="#e2e0ec"/>
