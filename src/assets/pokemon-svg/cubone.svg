<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcb078"/>
      <stop offset="1" stop-color="#c08a52"/>
    </linearGradient>
    <radialGradient id="skull" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8d6e2"/>
    </radialGradient>
  </defs>
  <g stroke="#2b2433" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- bone held low on the left -->
    <path d="M44 236 L92 168" fill="none" stroke-width="20"/>
    <path d="M44 236 L92 168" fill="none" stroke="#f2eee4" stroke-width="11"/>
    <circle cx="36" cy="236" r="10" fill="#f2eee4"/>
    <circle cx="48" cy="246" r="9" fill="#f2eee4"/>
    <!-- tail -->
    <path d="M178 214 C200 216 214 208 220 194 C222 210 212 230 184 234 Z" fill="#b07c48"/>
    <!-- feet -->
    <ellipse cx="94" cy="236" rx="26" ry="12" fill="#c08a52"/>
    <ellipse cx="166" cy="236" rx="26" ry="12" fill="#b07c48"/>
    <!-- body -->
    <path d="M128 124 C172 124 196 156 194 192 C192 222 164 238 128 238 C92 238 64 222 62 192 C60 156 84 124 128 124 Z" fill="url(#skin)"/>
    <path d="M128 150 C156 150 172 172 170 198 C168 222 150 232 128 232 C106 232 88 222 86 198 C84 172 100 150 128 150 Z" fill="#f4e8c4"/>
    <!-- arms -->
    <path d="M70 160 C56 166 50 178 56 188 C62 194 74 190 84 176 Z" fill="#c08a52"/>
    <path d="M186 160 C200 166 206 178 200 188 C194 194 182 190 172 176 Z" fill="#b07c48"/>
    <!-- brown face under the skull -->
    <path d="M70 110 C70 90 96 82 128 82 C160 82 186 90 186 110 C186 134 160 150 128 150 C96 150 70 134 70 110 Z" fill="#c08a52"/>
    <!-- skull helmet with horns, long snout -->
    <path d="M128 12 C170 12 194 36 198 66 L216 40 L212 86 C210 106 196 118 182 120 C176 136 162 146 148 148 L108 148 C94 146 80 136 74 120 C60 118 46 106 44 86 L40 40 L58 66 C62 36 86 12 128 12 Z" fill="url(#skull)"/>
  </g>
  <!-- eye sockets show the brown face and eyes -->
  <path d="M82 86 C86 74 104 70 116 78 C120 90 114 104 102 106 C90 106 80 98 82 86 Z" fill="#6e4628" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <path d="M174 86 C170 74 152 70 140 78 C136 90 142 104 154 106 C166 106 176 98 174 86 Z" fill="#6e4628" stroke="#2b2433" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="100" cy="92" rx="7" ry="9" fill="#2b2433"/>
  <ellipse cx="156" cy="92" rx="7" ry="9" fill="#2b2433"/>
  <circle cx="102" cy="88" r="3" fill="#fff"/>
  <circle cx="158" cy="88" r="3" fill="#fff"/>
  <!-- nostril holes + cracks -->
  <ellipse cx="116" cy="132" rx="5" ry="6" fill="#2b2433"/>
  <ellipse cx="140" cy="132" rx="5" ry="6" fill="#2b2433"/>
  <path d="M128 14 L128 30 L120 40 M150 18 L146 32" fill="none" stroke="#a8a4b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M176 40 C194 64 194 96 180 118 C176 128 170 136 160 142 C176 112 182 76 176 40 Z" fill="#b8b4c8" opacity="0.6"/>
  <ellipse cx="98" cy="36" rx="16" ry="7" fill="#fff" opacity="0.8" transform="rotate(-20 98 36)"/>
  <path d="M60 184 l-6 6 M66 190 l-4 7" stroke="#2b2433" stroke-width="2"/>
</svg>
